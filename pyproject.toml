[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autopatch"
version = "0.2.0"
description = "SBOM-guided automated remediation for container images in CI/CD pipelines."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Nour R. M. Alhouseini", email = "nalhouse@depaul.edu" },
]
keywords = [
    "container-security",
    "sbom",
    "vulnerability-management",
    "cicd",
    "devsecops",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Build Tools",
]

dependencies = [
    "pyyaml>=6.0,<7.0",
    "requests>=2.32.0,<3.0",
    "urllib3>=2.2.2,<3.0",
    "dpkt==1.9.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "pip-audit>=2.7",
    "bandit>=1.7",
]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
autopatch = "src.main:main"

[project.urls]
Homepage = "https://github.com/0xLumos/AutoPatch"
Repository = "https://github.com/0xLumos/AutoPatch"
Issues = "https://github.com/0xLumos/AutoPatch/issues"

[tool.setuptools.packages.find]
include = ["src*"]
exclude = ["tests*", "experiments*", "figures*", "research*"]

[tool.setuptools.package-data]
src = ["image_registry.yaml", "*.yaml"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
    "experiments",
    "figures",
    "research",
    "tests/test_e2e_simulation.py",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "W",      # pycodestyle warnings
    "B",      # flake8-bugbear
    "I",      # isort
    "UP",     # pyupgrade
    "S",      # flake8-bandit
    "RUF",    # ruff-specific
]
ignore = [
    "E501",   # line length, handled by formatter
    "S101",   # assert in tests
    "S603",   # subprocess call, this is a subprocess-driven tool
    "S607",   # partial-path subprocess (we shell out to docker/trivy/cosign/gh)
    "B008",   # function call in argument default (argparse)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106", "S311"]
"src/main.py"  = ["E402"]

[tool.mypy]
python_version = "3.10"
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true
exclude = "^(experiments/|figures/|research/)"

[tool.coverage.run]
branch = true
source = ["src"]
omit = [
    "src/experiment_runner.py",
    "src/dockerhub_fetcher.py",
    "src/dockerhub_images_runner.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
