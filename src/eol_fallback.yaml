# Hardcoded EOL fallback table used when endoflife.date is unreachable
# (air-gapped CI, network outage, etc.). Keys are AutoPatch language
# identifiers; values map an EOL version to the lowest still-supported
# successor.
#
# DO NOT delete an entry; the resolver falls through to the live API
# first, so this only fires offline. If you ever delete the live API
# path or run permanently offline, keep this current.
#
# Two properties make a stale entry safe rather than wrong:
#   1. Every mapping points at a version that was supported when the
#      row was written, so the worst case of staleness is landing on a
#      release that is older than the current one, never on an EOL one.
#   2. The chosen tag is verified against the registry before it is
#      emitted, so a successor that was never published is dropped.
# A MISSING row is the real failure mode: the EOL version is then left
# in place. Prefer over-listing to under-listing.
#
# Update cadence: review quarterly against
# https://endoflife.date/<lang>.
#
# Last reviewed: 2026-08

