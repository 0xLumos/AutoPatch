# Pinned SHA256 checksums for scanner binaries that AutoPatch /
# LimenSec knows how to verify. Hashes were computed directly from
# the upstream GitHub release artifacts at the URLs listed in each
# comment.
#
# Adding a new version is a deliberate trust step:
#   1. Download the official release tarball from
#      https://github.com/aquasecurity/trivy/releases (or anchore/grype,
#      sigstore/cosign).
#   2. Verify the cosign signature on the release tarball (cosign
#      verify-blob with the per-release cert identity).
#   3. Compute SHA256:  shasum -a 256 <file>
#   4. Paste the hash here keyed by version.
#
# Operators can extend with --scanner-checksums pointing at a YAML
# file with the same shape; those entries override the bundled set.
#
# Last verified: 2026-05-15

